name: build

on:
  push:
    branches: [main, core]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the project claims to support, 21 is the current LTS.
        # Building on both keeps that claim honest.
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Runs exactly what README section 1 tells a reviewer to run. If the README
      # instructions ever stop working, this job is what notices.
      - name: Build, test and check coverage
        run: mvn -B -ntp -P full clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

      - name: Publish coverage report
        if: always() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: add2num-core/target/site/jacoco/**
          if-no-files-found: ignore
