spring:
  application:
    name: add2num-web
  thymeleaf:
    cache: true          # turned off automatically by spring-boot-devtools during development
  mvc:
    problemdetails:
      enabled: false     # this application answers with its own ApiError shape

server:
  port: 8080
  error:
    whitelabel:
      enabled: false     # templates/error.html is used instead
  compression:
    enabled: true        # a 100 000 digit answer compresses extremely well
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2KB

# Limits this deployment is willing to accept. See Add2NumProperties for what each one guards.
add2num:
  max-input-digits: 100000
  max-trace-steps: 500
  max-column-layout-width: 40

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.caesar.add2num: INFO
    # The core library logs through java.lang.System.Logger, which Spring Boot bridges to Logback.
    # Raise this to DEBUG for one line per calculation. The per column TRACE lines additionally
    # need the JDK logging level to be opened up, for example with
    #   -Djava.util.logging.ConsoleHandler.level=FINEST
